<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexus Dash - Administrator Portal Sign In">
    <title>Sign In - Nexus Dash</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-badge" style="margin: 0 auto 12px auto;">N</div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your administrative account</p>
        </div>

        <form id="login-form" novalidate>
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="admin@example.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="password" class="form-label">Password</label>
                    <a href="forgot-password.html" style="font-size: 11px; color: var(--color-primary); font-weight: 600;">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-muted); cursor: pointer;">
                    <input type="checkbox" id="remember-me" name="remember" style="accent-color: var(--color-primary); width: 16px; height: 16px;">
                    <span>Remember me on this device</span>
                </label>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; height: 44px; font-size: 14px;">
                <span>Sign In</span>
                <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>
        </form>

        <div style="text-align: center; font-size: 12px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
            <span>Need an account?</span>
            <a href="register.html" style="color: var(--color-primary); font-weight: 600; margin-left: 4px;">Register here</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/forms.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) window.lucide.createIcons();

            setupFormValidation("#login-form", (form) => {
                showToast("Authentication successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);
            });
        });
    </script>
</body>
</html>
