<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexus Dash - Recover Password">
    <title>Forgot Password - Nexus Dash</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-badge" style="margin: 0 auto 12px auto;">N</div>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your email to receive recovery instructions</p>
        </div>

        <form id="forgot-form" novalidate>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="recovery-email" class="form-label">Registered Email</label>
                <input type="email" id="recovery-email" name="email" class="form-input" placeholder="admin@example.com" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; height: 44px; font-size: 14px;">
                <span>Send Reset Link</span>
                <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
            </button>
        </form>

        <div style="text-align: center; font-size: 12px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
            <a href="login.html" style="color: var(--color-primary); font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                <span>Back to Sign In</span>
            </a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/forms.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) window.lucide.createIcons();

            setupFormValidation("#forgot-form", (form) => {
                showToast("Password reset instructions dispatched to your email", "success");
            });
        });
    </script>
</body>
</html>
