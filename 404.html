<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexus Dash - Page Not Found">
    <title>404 Not Found - Nexus Dash</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-layout">
    <div class="auth-card" style="text-align: center; max-width: 480px;">
        <div style="font-size: 64px; font-weight: 800; color: var(--color-primary); line-height: 1;">404</div>
        <h1 class="auth-title" style="margin-top: 10px;">Page Not Found</h1>
        <p class="auth-subtitle">The requested route or administrative document could not be located.</p>

        <div style="margin: 20px 0;">
            <img src="assets/images/empty-state.svg" alt="Empty state" width="160" height="120" style="margin: 0 auto;">
        </div>

        <a href="index.html" class="btn-primary" style="justify-content: center; height: 44px;">
            <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
            <span>Return to Dashboard</span>
        </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
